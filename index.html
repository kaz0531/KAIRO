<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KAIRO — パーソナルAIコンパニオン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: [
              'Inter',
              '-apple-system',
              'BlinkMacSystemFont',
              'Hiragino Sans',
              'Hiragino Kaku Gothic ProN',
              'Yu Gothic',
              'Meiryo',
              'sans-serif',
            ],
            mono: [
              'ui-monospace',
              'SFMono-Regular',
              'Menlo',
              'Monaco',
              'Consolas',
              'monospace',
            ],
          },
        },
      },
    };
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(129, 140, 248, 0.28);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(167, 139, 250, 0.48);
    }

    @keyframes kairoFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-5px) scale(1.012);
      }
    }
    .kairo-avatar-float {
      animation: kairoFloat 5.2s ease-in-out infinite;
    }

    @keyframes kairoHalo {
      0%, 100% {
        opacity: 0.34;
        transform: scale(0.98);
      }
      50% {
        opacity: 0.72;
        transform: scale(1.05);
      }
    }
    .kairo-avatar-halo {
      animation: kairoHalo 3.4s ease-in-out infinite;
    }

    @keyframes kairoAppear {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .kairo-appear {
      animation: kairoAppear 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes kairoCursorBlink {
      0%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .kairo-streaming::after {
      content: '▍';
      display: inline-block;
      margin-left: 3px;
      color: #a78bfa;
      animation: kairoCursorBlink 0.9s infinite;
    }

    @keyframes kairoPulseDot {
      0%, 80%, 100% { opacity: 0.28; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1.1); }
    }
    .kairo-dot-1 { animation: kairoPulseDot 1.2s infinite 0s; }
    .kairo-dot-2 { animation: kairoPulseDot 1.2s infinite 0.2s; }
    .kairo-dot-3 { animation: kairoPulseDot 1.2s infinite 0.4s; }

    @media (prefers-reduced-motion: reduce) {
      .kairo-avatar-float,
      .kairo-avatar-halo,
      .kairo-appear,
      .kairo-streaming::after,
      .kairo-dot-1,
      .kairo-dot-2,
      .kairo-dot-3 {
        animation: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-[#060916] dark:text-slate-100 antialiased selection:bg-violet-500/30 selection:text-sky-200">
  <div id="app" class="flex h-dvh w-full overflow-hidden"></div>

  <script>
    (function () {
      'use strict';

      /**
       * KAIRO 設定定数
       * - APIキーはクライアント側に一切保持・入力せず、Cloudflare Worker 経由で安全に通信します。
       */
      const WORKER_ENDPOINT = 'https://kairo-api.kazukifunahashi.workers.dev';
      const REQUEST_TIMEOUT_MS = 35000;

      const STORAGE_KEYS = {
        CONVERSATIONS: 'kairo_worker_v1_conversations',
        MEMORIES: 'kairo_worker_v1_memories',
        DAILIES: 'kairo_worker_v1_dailies',
        SPACE: 'kairo_worker_v1_active_space',
        THEME: 'kairo_worker_v1_theme',
        ACTIVE_VIEW: 'kairo_worker_v1_active_view',
        ACTIVE_CONV: 'kairo_worker_v1_active_conv',
        SNAPSHOTS: 'kairo_worker_v1_snapshots',
      };

      const SPACES = [
        {
          id: 'casual',
          name: '雑談',
          shortLabel: '雑談',
          description: '気負わない日常会話や、その日のちょっとした出来事',
          promptRule:
            '現在の空間は「雑談」。自然体で落ち着いたトーンを保ち、相手の話の流れに合わせて簡潔かつ人間らしく応答してください。',
        },
        {
          id: 'dictionary',
          name: '勉強・辞書',
          shortLabel: '勉強・辞書',
          description: '言葉の意味・概念の違い・仕組みを結論から整理して調べる時間',
          promptRule:
            '現在の空間は「勉強・辞書」。定義・結論・違いや仕組みの要点を前置きなく具体的に整理して返してください。',
        },
        {
          id: 'work',
          name: '仕事・整理',
          shortLabel: '仕事・整理',
          description: 'タスク分解、優先順位、文章構成、判断材料の整理',
          promptRule:
            '現在の空間は「仕事・整理」。論点を整理し、実用的で過不足のない構成と具体策を提示してください。',
        },
        {
          id: 'ideas',
          name: '相談・アイデア',
          shortLabel: '相談・アイデア',
          description: '考えの壁打ち、視点の切り替え、新しいアイデア出し',
          promptRule:
            '現在の空間は「相談・アイデア」。過剰な褒め言葉や迎合を避け、現実的な観点と新しい切り口を落ち着いて提示してください。',
        },
      ];

      /**
       * 安全なストレージラッパー（localStorage 制限時はメモリへフォールバック）
       */
      const memoryFallback = new Map();

      function readStorage(key) {
        try {
          if (typeof localStorage !== 'undefined') {
            const val = localStorage.getItem(key);
            if (val !== null) return val;
          }
        } catch {
          // サンドボックス等で localStorage が制限された場合はメモリフォールバックを使用
        }
        return memoryFallback.has(key) ? memoryFallback.get(key) : null;
      }

      function writeStorage(key, value) {
        memoryFallback.set(key, value);
        try {
          if (typeof localStorage !== 'undefined') {
            localStorage.setItem(key, value);
          }
        } catch {
          // メモリフォールバックのみ維持
        }
      }

      function safeParseArray(raw) {
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function applyThemeClass(theme) {
        try {
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch {
          // ignore
        }
      }

      function loadTheme() {
        return readStorage(STORAGE_KEYS.THEME) === 'light' ? 'light' : 'dark';
      }

      function saveTheme(theme) {
        writeStorage(STORAGE_KEYS.THEME, theme);
        applyThemeClass(theme);
      }

      function loadActiveSpace() {
        const id = readStorage(STORAGE_KEYS.SPACE);
        return SPACES.some((s) => s.id === id) ? id : SPACES[0].id;
      }

      function saveActiveSpace(id) {
        writeStorage(STORAGE_KEYS.SPACE, id);
      }

      function makeId(prefix) {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      }

      function formatDateShort(iso) {
        try {
          return new Date(iso).toLocaleString('ja-JP', {
            month: 'numeric',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
          });
        } catch {
          return '';
        }
      }

      const initialConversations = safeParseArray(readStorage(STORAGE_KEYS.CONVERSATIONS));
      const storedConvId = readStorage(STORAGE_KEYS.ACTIVE_CONV);
      const validStoredConvId =
        storedConvId && initialConversations.some((c) => c.id === storedConvId)
          ? storedConvId
          : null;
      const storedView = readStorage(STORAGE_KEYS.ACTIVE_VIEW);
      const validInitialView = ['home', 'chat', 'spaces', 'daily', 'memory', 'settings'].includes(
        storedView
      )
        ? storedView === 'chat' && !validStoredConvId
          ? 'home'
          : storedView
        : 'home';

      const state = {
        theme: loadTheme(),
        activeSpaceId: loadActiveSpace(),
        view: validInitialView, // 'home' | 'chat' | 'spaces' | 'daily' | 'memory' | 'settings'
        drawerOpen: false,
        conversations: initialConversations,
        currentConversationId: validStoredConvId,
        spaceFilterId: 'all',
        memories: safeParseArray(readStorage(STORAGE_KEYS.MEMORIES)),
        dailies: safeParseArray(readStorage(STORAGE_KEYS.DAILIES)),
        snapshots: safeParseArray(readStorage(STORAGE_KEYS.SNAPSHOTS)),
        draft: '',
        memoryDraft: '',
        memoryTag: 'メモ',
        editingMemoryId: null,
        editingMemoryText: '',
        dailyMood: '穏やか',
        dailyNote: '',
        importJsonDraft: '',
        isBusy: false,
        avatarMood: 'idle', // 'idle' | 'calm' | 'thinking' | 'speaking' | 'error'
        errorMessage: null,
        noticeMessage: null,
        copiedKey: null,
      };

      let activeAbortController = null;
      let revealRafId = null;
      let activeRevealTask = null;

      function persistNavigation() {
        writeStorage(STORAGE_KEYS.ACTIVE_VIEW, state.view);
        writeStorage(STORAGE_KEYS.ACTIVE_CONV, state.currentConversationId || '');
      }

      function saveConversations() {
        writeStorage(STORAGE_KEYS.CONVERSATIONS, JSON.stringify(state.conversations));
      }

      function saveMemories() {
        writeStorage(STORAGE_KEYS.MEMORIES, JSON.stringify(state.memories));
      }

      function saveDailies() {
        writeStorage(STORAGE_KEYS.DAILIES, JSON.stringify(state.dailies));
      }

      function saveSnapshots() {
        writeStorage(STORAGE_KEYS.SNAPSHOTS, JSON.stringify(state.snapshots));
      }

      function getCurrentSpace() {
        return SPACES.find((s) => s.id === state.activeSpaceId) || SPACES[0];
      }

      function getCurrentConversation() {
        if (!state.currentConversationId) return null;
        return state.conversations.find((c) => c.id === state.currentConversationId) || null;
      }

      /**
       * 会話タイトルを最初の有効なユーザーメッセージから自動生成・維持
       */
      function deriveConversationTitle(conv) {
        const firstUser = conv.messages.find(
          (m) => m.role === 'user' && typeof m.content === 'string' && m.content.trim()
        );
        if (!firstUser) return '新しい会話';
        const clean = firstUser.content.replace(/\s+/g, ' ').trim();
        return clean.length > 24 ? `${clean.slice(0, 24)}…` : clean;
      }

      function getCompanionGreeting() {
        const now = new Date();
        const hour = now.getHours();
        const day = now.getDate();
        const count = state.conversations.length;
        const period = hour < 5 ? '深夜' : hour < 11 ? '朝' : hour < 17 ? '昼' : '夜';

        const greetings = [
          `${period}の時間ですね。調べたいことでも、ちょっとした話でもそのままどうぞ。`,
          'おかえりなさい。気になる言葉の意味でも、今日の出来事でも気軽に話しかけてね。',
          'いまどんな気分ですか？考え事の整理や雑談まで、ここからすぐ話せます。',
          '静かに話せる場所を用意しています。知りたいことや迷っていることを教えて。',
        ];
        return greetings[(day + hour + count) % greetings.length];
      }

      /**
       * KAIRO 人格・Space・Memory を反映した systemInstruction の組み立て
       */
      function buildSystemInstruction(spaceObj) {
        const space = spaceObj || getCurrentSpace();
        const lines = [
          'あなたはパーソナルAIコンパニオン「KAIRO」です。知的で自然体、落ち着いた日本語で会話してください。',
          '厳守するルール:',
          '1. 質問には具体的に答えること。抽象的な言い換えや前置きだけで終わらせないこと。',
          '2. ユーザーの発言をそのまま繰り返したり、単なるオウム返し・言い換えだけで返したりしないこと。',
          '3. 前の会話の流れを踏まえること。話題が変わったら新しい話題に焦点を合わせ、「さっきの話」など前の話題に戻ったときは直前の文脈を整理して扱うこと。',
          '4. 過剰な共感や迎合、無条件の褒め言葉を使わないこと。必要に応じて率直な視点や根拠も丁寧に伝えること。',
          '5. 毎回必ず質問で終わらせないこと。言い切りや考えの提示で自然に止めてよい。',
          '6. リアルタイム情報（現在の天気・最新ニュース・外部の未接続データなど）が不確かな場合は推測で事実を捏造せず、現在取得できない点と確認方法を正直に伝えること。',
          '7. 「私はAIのKAIROです」といった機械的な自己紹介を繰り返さないこと。',
          space.promptRule,
        ];

        if (state.memories.length > 0) {
          const memItems = state.memories
            .slice(0, 15)
            .map((m) => `- [${m.tag}] ${m.text}`)
            .join('\n');
          lines.push(`ユーザーが保存したメモ（関連する場面で自然に参照）:\n${memItems}`);
        }

        return lines.join('\n');
      }

      /**
       * 送信履歴の組み立て:
       * - 完了済み（status === "completed"）かつ空でないターンのみを抽出
       * - 今回送信する最新メッセージは含めず、Worker側での重複を防止
       * - エラーターンは除外
       */
      function buildWorkerHistory(messages) {
        const result = [];
        for (const msg of messages) {
          if (!msg || msg.status !== 'completed') continue;
          const text = typeof msg.content === 'string' ? msg.content.trim() : '';
          if (!text) continue;
          const role = msg.role === 'assistant' ? 'assistant' : 'user';
          result.push({ role, content: text });
        }
        return result;
      }

      /**
       * スクロール位置を最下部へ維持（上方向へ跳び戻らないように制御）
       */
      function scrollMessagesToBottom(force) {
        const area = document.getElementById('chat-scroll-area');
        if (!area) return;
        const distanceFromBottom = area.scrollHeight - area.scrollTop - area.clientHeight;
        if (force || distanceFromBottom < 220) {
          area.scrollTop = area.scrollHeight;
        }
      }

      /**
       * requestAnimationFrame を用いた滑らかなタイピング／段階表示
       */
      function cancelRevealAnimation() {
        if (revealRafId !== null && typeof cancelAnimationFrame === 'function') {
          cancelAnimationFrame(revealRafId);
        }
        revealRafId = null;
        activeRevealTask = null;
      }

      function revealReplySmoothly(assistantMsg, fullReply, onComplete) {
        cancelRevealAnimation();

        const totalLength = fullReply.length;
        if (totalLength === 0 || typeof requestAnimationFrame !== 'function') {
          assistantMsg.content = fullReply;
          assistantMsg.status = 'completed';
          onComplete();
          return;
        }

        // 長文でも1.2〜1.8秒程度で快適に読み切れるステップ幅を計算
        const targetFrames = Math.min(75, Math.max(18, Math.ceil(totalLength / 6)));
        const charsPerFrame = Math.max(1, Math.ceil(totalLength / targetFrames));
        let cursor = 0;

        activeRevealTask = { assistantMsg, fullReply, onComplete };

        const step = () => {
          cursor = Math.min(totalLength, cursor + charsPerFrame);
          assistantMsg.content = fullReply.slice(0, cursor);

          const bodyEl = document.querySelector(`[data-stream-body="${assistantMsg.id}"]`);
          if (bodyEl) {
            bodyEl.innerHTML = renderMarkdown(assistantMsg.content);
            scrollMessagesToBottom(false);
          }

          if (cursor < totalLength) {
            revealRafId = requestAnimationFrame(step);
          } else {
            revealRafId = null;
            activeRevealTask = null;
            assistantMsg.content = fullReply;
            assistantMsg.status = 'completed';
            onComplete();
          }
        };

        revealRafId = requestAnimationFrame(step);
      }

      /**
       * Cloudflare Worker へ POST 送信し、reply を受信する
       */
      async function requestWorkerReply({ message, history, systemInstruction, signal }) {
        const timeoutCtrl = new AbortController();
        let timedOut = false;
        const timer = setTimeout(() => {
          timedOut = true;
          timeoutCtrl.abort();
        }, REQUEST_TIMEOUT_MS);

        const forwardAbort = () => timeoutCtrl.abort();
        if (signal) {
          if (signal.aborted) timeoutCtrl.abort();
          else signal.addEventListener('abort', forwardAbort, { once: true });
        }

        let response;
        try {
          response = await fetch(WORKER_ENDPOINT, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            signal: timeoutCtrl.signal,
            body: JSON.stringify({
              message,
              history,
              systemInstruction,
            }),
          });
        } catch (err) {
          clearTimeout(timer);
          if (signal) signal.removeEventListener('abort', forwardAbort);
          if (timedOut) {
            throw new Error(
              `KAIROサーバーへの接続がタイムアウトしました（${REQUEST_TIMEOUT_MS / 1000}秒）。通信環境を確認して再度お試しください。`
            );
          }
          if (signal && signal.aborted) {
            throw new DOMException('送信をキャンセルしました。', 'AbortError');
          }
          const detail = err instanceof Error ? err.message : String(err);
          throw new Error(`通信エラーが発生しました: ${detail}`);
        }

        clearTimeout(timer);
        if (signal) signal.removeEventListener('abort', forwardAbort);

        let data = null;
        try {
          data = await response.json();
        } catch {
          if (!response.ok) {
            throw new Error(`サーバーエラーが発生しました（HTTP ${response.status}）。`);
          }
          throw new Error('サーバーからの応答JSONを解析できませんでした。');
        }

        if (!response.ok) {
          const errText =
            data && typeof data.error === 'string' && data.error.trim()
              ? data.error.trim()
              : `サーバーエラー（HTTP ${response.status}）`;
          throw new Error(errText);
        }

        if (data && typeof data.error === 'string' && data.error.trim()) {
          throw new Error(data.error.trim());
        }

        const reply = data && typeof data.reply === 'string' ? data.reply : '';
        if (!reply.trim()) {
          throw new Error('KAIROサーバーから有効な返答が返りませんでした。');
        }

        return reply;
      }

      async function sendMessage(overrideText) {
        if (state.isBusy) return;
        const prompt = (typeof overrideText === 'string' ? overrideText : state.draft).trim();
        if (!prompt) return;

        const space = getCurrentSpace();
        state.errorMessage = null;
        state.noticeMessage = null;
        state.view = 'chat';
        state.drawerOpen = false;
        if (typeof overrideText !== 'string') {
          state.draft = '';
        }

        let conv = getCurrentConversation();
        if (!conv) {
          conv = {
            id: makeId('conv'),
            title: '新しい会話',
            spaceId: space.id,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            messages: [],
          };
          state.conversations.unshift(conv);
          state.currentConversationId = conv.id;
        }

        // 送信前の既存完了済みターンを history として構築（最新発話の重複を防止）
        const historyPayload = buildWorkerHistory(conv.messages);
        const convSpace = SPACES.find((s) => s.id === conv.spaceId) || space;
        const systemInstruction = buildSystemInstruction(convSpace);

        const userMsg = {
          id: makeId('msg'),
          role: 'user',
          content: prompt,
          status: 'completed',
          createdAt: new Date().toISOString(),
        };

        const assistantMsg = {
          id: makeId('msg'),
          role: 'assistant',
          content: '',
          status: 'streaming',
          createdAt: new Date().toISOString(),
        };

        conv.messages.push(userMsg, assistantMsg);
        conv.title = deriveConversationTitle(conv);
        conv.updatedAt = new Date().toISOString();
        saveConversations();
        persistNavigation();

        state.isBusy = true;
        state.avatarMood = 'thinking';
        activeAbortController = new AbortController();

        render();
        scrollMessagesToBottom(true);

        try {
          const replyText = await requestWorkerReply({
            message: prompt,
            history: historyPayload,
            systemInstruction,
            signal: activeAbortController.signal,
          });

          state.avatarMood = 'speaking';
          render();
          scrollMessagesToBottom(false);

          revealReplySmoothly(assistantMsg, replyText, () => {
            conv.updatedAt = new Date().toISOString();
            saveConversations();
            state.isBusy = false;
            state.avatarMood = 'calm';
            activeAbortController = null;
            render();
            scrollMessagesToBottom(false);
          });
        } catch (err) {
          cancelRevealAnimation();
          const aborted = Boolean(err && err.name === 'AbortError');
          const detail = aborted
            ? '応答を停止しました。'
            : err instanceof Error
            ? err.message
            : '不明な通信エラーが発生しました。';

          if (aborted && assistantMsg.content.trim()) {
            assistantMsg.status = 'completed';
            state.avatarMood = 'calm';
          } else {
            assistantMsg.status = 'error';
            assistantMsg.errorText = detail;
            if (!aborted) {
              state.errorMessage = detail;
              state.avatarMood = 'error';
            } else {
              state.avatarMood = 'idle';
            }
          }

          conv.updatedAt = new Date().toISOString();
          saveConversations();
          state.isBusy = false;
          activeAbortController = null;
          render();
          scrollMessagesToBottom(false);
        }
      }

      function stopActiveRequest() {
        if (activeAbortController) {
          activeAbortController.abort();
        }
        if (activeRevealTask) {
          const { assistantMsg, fullReply, onComplete } = activeRevealTask;
          cancelRevealAnimation();
          if (!assistantMsg.content.trim()) {
            assistantMsg.content = fullReply;
          }
          assistantMsg.status = 'completed';
          onComplete();
        }
      }

      function navigateTo(viewName) {
        if (state.isBusy) stopActiveRequest();
        state.errorMessage = null;
        state.view = viewName;
        state.drawerOpen = false;
        if (viewName === 'home') {
          state.avatarMood = 'idle';
        }
        persistNavigation();
        render();
      }

      function startNewChat(focusInput = true) {
        if (state.isBusy) stopActiveRequest();
        state.errorMessage = null;
        state.currentConversationId = null;
        state.draft = '';
        state.view = 'chat';
        state.drawerOpen = false;
        state.avatarMood = 'calm';
        persistNavigation();
        render();
        if (focusInput) {
          setTimeout(() => {
            const ta = document.getElementById('chat-input');
            if (ta) ta.focus();
          }, 30);
        }

      function openConversation(id) {
        if (state.isBusy) stopActiveRequest();
        const target = state.conversations.find((c) => c.id === id);
        if (!target) return;
        state.errorMessage = null;
        state.currentConversationId = target.id;
        if (target.spaceId && SPACES.some((s) => s.id === target.spaceId)) {
          state.activeSpaceId = target.spaceId;
          saveActiveSpace(target.spaceId);
        }
        state.view = 'chat';
        state.drawerOpen = false;
        state.avatarMood = 'calm';
        persistNavigation();
        render();
        scrollMessagesToBottom(true);
      }

      function deleteConversation(id) {
        state.conversations = state.conversations.filter((c) => c.id !== id);
        if (state.currentConversationId === id) {
          state.currentConversationId = null;
          if (state.view === 'chat') {
            state.view = 'home';
            state.avatarMood = 'idle';
          }
        }
        saveConversations();
        persistNavigation();
        render();
      }

      function createSnapshot(label) {
        const snapshot = {
          id: makeId('snap'),
          label: label || `バックアップ (${formatDateShort(new Date().toISOString())})`,
          createdAt: new Date().toISOString(),
          payload: {
            conversations: state.conversations,
            memories: state.memories,
            dailies: state.dailies,
            activeSpaceId: state.activeSpaceId,
            theme: state.theme,
          },
        };
        state.snapshots.unshift(snapshot);
        state.snapshots = state.snapshots.slice(0, 10);
        saveSnapshots();
        state.noticeMessage = '現在の状態をスナップショットに保存しました。';
        render();
      }

      function restoreSnapshot(snapId) {
        const snap = state.snapshots.find((s) => s.id === snapId);
        if (!snap || !snap.payload) return;
        state.conversations = Array.isArray(snap.payload.conversations)
          ? snap.payload.conversations
          : [];
        state.memories = Array.isArray(snap.payload.memories) ? snap.payload.memories : [];
        state.dailies = Array.isArray(snap.payload.dailies) ? snap.payload.dailies : [];
        if (snap.payload.activeSpaceId && SPACES.some((s) => s.id === snap.payload.activeSpaceId)) {
          state.activeSpaceId = snap.payload.activeSpaceId;
          saveActiveSpace(state.activeSpaceId);
        }
        if (snap.payload.theme === 'light' || snap.payload.theme === 'dark') {
          state.theme = snap.payload.theme;
          saveTheme(state.theme);
        }
        state.currentConversationId = null;
        saveConversations();
        saveMemories();
        saveDailies();
        persistNavigation();
        state.noticeMessage = `「${snap.label}」から復元しました。`;
        render();
      }

      function exportAllJson() {
        const bundle = {
          app: 'KAIRO',
          exportedAt: new Date().toISOString(),
          conversations: state.conversations,
          memories: state.memories,
          dailies: state.dailies,
          activeSpaceId: state.activeSpaceId,
          theme: state.theme,
        };
        const jsonStr = JSON.stringify(bundle, null, 2);
        try {
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `kairo-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          state.noticeMessage = 'JSONバックアップファイルを書き出しました。';
          render();
        } catch {
          void copyToClipboard(jsonStr, 'export_json');
        }
      }

      function importFromJsonText(rawText) {
        const trimmed = String(rawText || '').trim();
        if (!trimmed) {
          state.errorMessage = 'インポートするJSON文字列を入力してください。';
          render();
          return;
        }
        try {
          const parsed = JSON.parse(trimmed);
          if (!parsed || typeof parsed !== 'object') {
            throw new Error('JSONオブジェクトの形式が正しくありません。');
          }
          if (Array.isArray(parsed.conversations)) state.conversations = parsed.conversations;
          if (Array.isArray(parsed.memories)) state.memories = parsed.memories;
          if (Array.isArray(parsed.dailies)) state.dailies = parsed.dailies;
          if (parsed.activeSpaceId && SPACES.some((s) => s.id === parsed.activeSpaceId)) {
            state.activeSpaceId = parsed.activeSpaceId;
            saveActiveSpace(state.activeSpaceId);
          }
          if (parsed.theme === 'light' || parsed.theme === 'dark') {
            state.theme = parsed.theme;
            saveTheme(state.theme);
          }
          state.currentConversationId = null;
          state.importJsonDraft = '';
          saveConversations();
          saveMemories();
          saveDailies();
          persistNavigation();
          state.errorMessage = null;
          state.noticeMessage = 'JSONデータを取り込みました。';
          render();
        } catch (err) {
          state.errorMessage = `JSONの読み込みに失敗しました: ${
            err instanceof Error ? err.message : '形式エラー'
          }`;
          render();
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatInlineMarkdown(lineText) {
        const inlineTokens = [];
        let result = lineText.replace(/`([^`\n]+)`/g, (_, code) => {
          const idx = inlineTokens.length;
          inlineTokens.push(
            `<code class="rounded bg-indigo-500/15 px-1.5 py-0.5 font-mono text-[0.85em] text-sky-700 dark:text-sky-300">${escapeHtml(
              code
            )}</code>`
          );
          return `@@INLINE_${idx}@@`;
        });
        result = escapeHtml(result);
        result = result.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold">$1</strong>');
        return result.replace(/@@INLINE_(\d+)@@/g, (_, idx) => inlineTokens[Number(idx)] || '');
      }

      function renderMarkdown(markdown) {
        if (!markdown) return '';
        const blocks = [];
        const fencePattern = /```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g;
        let lastIndex = 0;
        let match;

        while ((match = fencePattern.exec(markdown)) !== null) {
          if (match.index > lastIndex) {
            blocks.push({ kind: 'prose', text: markdown.slice(lastIndex, match.index) });
          }
          blocks.push({
            kind: 'code',
            lang: (match[1] || 'text').trim(),
            text: match[2].replace(/\n$/, ''),
          });
          lastIndex = fencePattern.lastIndex;
        }
        if (lastIndex < markdown.length) {
          blocks.push({ kind: 'prose', text: markdown.slice(lastIndex) });
        }

        return blocks
          .map((block) => {
            if (block.kind === 'code') {
              const preId = makeId('code');
              return `
                <div class="my-3 overflow-hidden rounded-xl border border-indigo-400/20 bg-[#050814] text-slate-100">
                  <div class="flex items-center justify-between border-b border-indigo-900/60 bg-[#0b1128] px-3 py-1.5 text-[11px] text-slate-400">
                    <span class="font-mono text-sky-300/80">${escapeHtml(block.lang)}</span>
                    <button type="button" data-copy-code="${preId}" class="rounded px-2 py-0.5 text-[11px] text-slate-300 hover:bg-indigo-500/20">
                      コピー
                    </button>
                  </div>
                  <pre id="${preId}" class="overflow-x-auto p-3 font-mono text-xs leading-relaxed"><code>${escapeHtml(
                    block.text
                  )}</code></pre>
                </div>
              `;
            }

            const lines = block.text.split('\n');
            const htmlParts = [];
            let i = 0;
            while (i < lines.length) {
              const current = lines[i];
              if (!current.trim()) {
                i += 1;
                continue;
              }
              if (/^[-*]\s+/.test(current)) {
                const listItems = [];
                while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
                  listItems.push(lines[i].replace(/^[-*]\s+/, ''));
                  i += 1;
                }
                htmlParts.push(
                  `<ul class="my-2 list-disc space-y-1 pl-5 text-sm leading-relaxed">${listItems
                    .map((item) => `<li>${formatInlineMarkdown(item)}</li>`)
                    .join('')}</ul>`
                );
                continue;
              }
              if (/^\d+\.\s+/.test(current)) {
                const numItems = [];
                while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
                  numItems.push(lines[i].replace(/^\d+\.\s+/, ''));
                  i += 1;
                }
                htmlParts.push(
                  `<ol class="my-2 list-decimal space-y-1 pl-5 text-sm leading-relaxed">${numItems
                    .map((item) => `<li>${formatInlineMarkdown(item)}</li>`)
                    .join('')}</ol>`
                );
                continue;
              }
              const paragraphLines = [];
              while (
                i < lines.length &&
                lines[i].trim() &&
                !/^[-*]\s+/.test(lines[i]) &&
                !/^\d+\.\s+/.test(lines[i])
              ) {
                paragraphLines.push(lines[i]);
                i += 1;
              }
              htmlParts.push(
                `<p class="my-1.5 text-sm leading-relaxed">${paragraphLines
                  .map((p) => formatInlineMarkdown(p))
                  .join('<br/>')}</p>`
              );
            }
            return htmlParts.join('');
          })
          .join('');
      }

      async function copyToClipboard(text, key) {
        try {
          const area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          document.body.removeChild(area);

          state.copiedKey = key;
          render();
          setTimeout(() => {
            if (state.copiedKey === key) {
              state.copiedKey = null;
              render();
            }
          }, 1400);
        } catch {
          state.errorMessage = 'クリップボードへのコピーに失敗しました。';
          render();
        }
      }

      function renderChatView() {
        const conv = getCurrentConversation();
        const space = conv
          ? SPACES.find((s) => s.id === conv.spaceId) || getCurrentSpace()
          : getCurrentSpace();
        const msgs = conv ? conv.messages : [];

        return `
          <div id="chat-scroll-area" class="flex-1 overflow-y-auto px-4 py-5 sm:px-6">
            <div class="mx-auto max-w-2xl space-y-6">
              ${
                msgs.length === 0
                  ? `<div class="py-10 text-center kairo-appear">
                      <div class="flex justify-center">${renderKairoAvatar('compact', state.avatarMood)}</div>
                      <p class="mt-3 text-sm text-slate-600 dark:text-slate-300">
                        ${escapeHtml(space.description)}
                      </p>
                    </div>`
                  : msgs
                      .map((m) => {
                        if (m.role === 'user') {
                          return `
                            <div class="flex justify-end kairo-appear">
                              <div class="max-w-[85%] rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 px-4 py-3 text-sm leading-relaxed text-white sm:max-w-[75%]">
                                <p class="whitespace-pre-wrap">${escapeHtml(m.content)}</p>
                              </div>
                            </div>
                          `;
                        }

                        const isStreamingMsg = m.status === 'streaming';
                        const isErrorMsg = m.status === 'error';
                        const isCopied = state.copiedKey === m.id;
                        const mood = isErrorMsg
                          ? 'error'
                          : isStreamingMsg
                          ? m.content
                            ? 'speaking'
                            : 'thinking'
                          : 'calm';

                        return `
                          <div class="flex items-start gap-3 kairo-appear">
                            <div class="mt-1">${renderKairoAvatar('compact', mood)}</div>
                            <div class="min-w-0 flex-1">
                              <div class="rounded-2xl border px-4 py-3.5 ${
                                isErrorMsg
                                  ? 'border-rose-500/40 bg-rose-500/10'
                                  : 'border-slate-200/80 bg-white/90 dark:border-indigo-400/15 dark:bg-[#0b1128]/90'
                              } ${isStreamingMsg && m.content ? 'kairo-streaming' : ''}">
                                <div data-stream-body="${escapeHtml(m.id)}">
                                  ${
                                    m.content
                                      ? renderMarkdown(m.content)
                                      : isStreamingMsg
                                      ? `<div class="flex items-center gap-1.5 py-1 text-slate-400" aria-label="応答を生成中">
                                          <span class="h-1.5 w-1.5 rounded-full bg-sky-400 kairo-dot-1"></span>
                                          <span class="h-1.5 w-1.5 rounded-full bg-indigo-400 kairo-dot-2"></span>
                                          <span class="h-1.5 w-1.5 rounded-full bg-violet-400 kairo-dot-3"></span>
                                        </div>`
                                      : ''
                                  }
                                </div>
                                ${
                                  isErrorMsg && m.errorText
                                    ? `<p class="text-xs leading-relaxed text-rose-600 dark:text-rose-300">${escapeHtml(
                                        m.errorText
                                      )}</p>`
                                    : ''
                                }
                              </div>
                              ${
                                m.content && !isStreamingMsg
                                  ? `<button
                                      type="button"
                                      data-copy-msg="${escapeHtml(m.id)}"
                                      class="mt-1.5 min-h-[32px] rounded-lg px-2 py-1 text-[11px] text-slate-500 transition hover:bg-slate-200/60 hover:text-slate-800 dark:text-slate-400 dark:hover:bg-indigo-950/70 dark:hover:text-slate-100"
                                    >
                                      ${isCopied ? 'コピーしました' : 'コピー'}
                                    </button>`
                                  : ''
                              }
                            </div>
                          </div>
                        `;
                      })
                      .join('')
              }

          </div>

          <div class="border-t border-slate-200/80 bg-slate-100/90 px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] backdrop-blur-md dark:border-indigo-400/15 dark:bg-[#060916]/90">

                class="max-h-36 min-h-[40px] flex-1 resize-none bg-transparent px-2.5 py-2 text-sm leading-relaxed text-slate-900 placeholder-slate-400 focus:outline-none dark:text-slate-100 dark:placeholder-slate-500"

                <button
                  type="button"
                  id="import-json-btn"
                  class="min-h-[38px] rounded-xl bg-indigo-600 px-4 py-1.5 text-xs font-medium text-white hover:bg-indigo-500"
                >
                  JSONから復元
                </button>
              </section>
            </div>
          </div>
        `;
      }

      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        const conv = getCurrentConversation();
        const space = conv
          ? SPACES.find((s) => s.id === conv.spaceId) || getCurrentSpace()
          : getCurrentSpace();

        const headerTitle =
          state.view === 'home'
            ? 'KAIRO'
            : state.view === 'chat'
            ? conv
              ? conv.title
              : `新しい会話（${space.shortLabel}）`
            : state.view === 'spaces'
            ? 'Spaces'
            : state.view === 'daily'
            ? 'Daily'
            : state.view === 'memory'
            ? 'Memory'
            : '設定・バックアップ';

        let mainContent = '';
        if (state.view === 'home') mainContent = renderHomeView();
        else if (state.view === 'chat') mainContent = renderChatView();
        else if (state.view === 'spaces') mainContent = renderSpacesView();
        else if (state.view === 'daily') mainContent = renderDailyView();
        else if (state.view === 'memory') mainContent = renderMemoryView();
        else mainContent = renderSettingsView();

        root.innerHTML = `
          ${
            state.drawerOpen
              ? `<div id="drawer-scrim" class="fixed inset-0 z-30 bg-slate-950/55 md:hidden"></div>`
              : ''
          }
          ${renderDrawer()}

          <div class="relative flex min-w-0 flex-1 flex-col bg-gradient-to-b from-slate-100 via-indigo-50/40 to-slate-100 dark:from-[#060916] dark:via-[#0a1026] dark:to-[#0e1533]">
            <div class="pointer-events-none absolute -top-24 right-10 h-72 w-72 rounded-full bg-violet-600/10 blur-3xl dark:bg-violet-600/15"></div>
            <div class="pointer-events-none absolute bottom-10 left-8 h-64 w-64 rounded-full bg-blue-500/10 blur-3xl dark:bg-sky-500/10"></div>

            <header class="relative z-10 flex h-14 shrink-0 items-center justify-between border-b border-slate-200/80 bg-white/80 px-3.5 backdrop-blur-md dark:border-indigo-400/15 dark:bg-[#060916]/80 sm:px-5">
              <div class="flex min-w-0 items-center gap-2">
                <button
                  type="button"
                  id="mobile-menu-btn"
                  aria-label="メニューを開く"
                  class="flex min-h-[40px] min-w-[40px] items-center justify-center rounded-xl text-slate-700 hover:bg-slate-200/60 dark:text-slate-200 dark:hover:bg-indigo-950/70 md:hidden"
                >
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                </button>
                <span class="truncate text-sm font-medium">${escapeHtml(headerTitle)}</span>
                ${
                  state.view === 'chat'
                    ? `<button type="button" data-go-view="spaces" class="hidden shrink-0 rounded-full border border-indigo-400/25 bg-indigo-500/10 px-2.5 py-0.5 text-[10px] font-medium text-sky-700 dark:text-sky-300 sm:inline-block">
                        ${escapeHtml(space.shortLabel)}
                      </button>`
                    : ''
                }
              </div>

              <div class="flex items-center gap-1.5">
                <button
                  type="button"
                  id="header-theme-btn"
                  class="min-h-[36px] rounded-xl px-2.5 py-1 text-xs text-slate-600 hover:bg-slate-200/60 dark:text-slate-300 dark:hover:bg-indigo-950/70"
                >
                  ${state.theme === 'dark' ? 'ライト' : 'ダーク'}
                </button>
                ${
                  state.view !== 'home'
                    ? `<button type="button" id="header-home-btn" class="min-h-[36px] rounded-xl px-2.5 py-1 text-xs text-slate-600 hover:bg-slate-200/60 dark:text-slate-300 dark:hover:bg-indigo-950/70">
                        ホーム
                      </button>`
                    : ''
                }
                ${
                  state.view === 'chat'
                    ? `<button type="button" id="header-new-chat-btn" class="min-h-[36px] rounded-xl border border-indigo-400/25 bg-indigo-500/10 px-2.5 py-1 text-xs font-medium text-slate-800 dark:text-slate-100">
                        新しい会話
                      </button>`
                    : ''
                }
              </div>
            </header>

            ${
              state.errorMessage
                ? `<div role="alert" class="relative z-10 flex items-center justify-between gap-2 border-b border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-xs text-rose-600 dark:text-rose-300">
                    <span class="min-w-0 flex-1">${escapeHtml(state.errorMessage)}</span>
                    <button type="button" id="close-error-btn" class="min-h-[32px] shrink-0 rounded-lg px-2 py-1 text-[11px] font-medium hover:bg-rose-500/15">
                      閉じる
                    </button>
                  </div>`
                : ''
            }

            ${
              state.noticeMessage
                ? `<div role="status" class="relative z-10 flex items-center justify-between gap-2 border-b border-sky-500/30 bg-sky-500/10 px-4 py-2 text-xs text-sky-700 dark:text-sky-300">
                    <span class="min-w-0 flex-1">${escapeHtml(state.noticeMessage)}</span>
                    <button type="button" id="close-notice-btn" class="min-h-[32px] shrink-0 rounded-lg px-2 py-1 text-[11px] font-medium hover:bg-sky-500/15">
                      閉じる
                    </button>
                  </div>`
                : ''
            }

            <div class="relative z-10 flex min-h-0 flex-1 flex-col">
              ${mainContent}
            </div>
          </div>
        `;

        bindAllEvents();
        autoResizeComposer();
      }

      function autoResizeComposer() {
        const input = document.getElementById('chat-input');
        if (!input) return;
        input.style.height = 'auto';
        input.style.height = `${Math.min(input.scrollHeight, 144)}px`;
      }

      function bindAllEvents() {
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        if (mobileMenuBtn) {
          mobileMenuBtn.addEventListener('click', () => {
            state.drawerOpen = !state.drawerOpen;
            render();
          });
        }

        const allHistoryBtn = document.getElementById('home-all-history-btn');
        if (allHistoryBtn) {
          allHistoryBtn.addEventListener('click', () => {
            state.drawerOpen = true;
            render();
          });
        }

        const drawerScrim = document.getElementById('drawer-scrim');
        if (drawerScrim) {
          drawerScrim.addEventListener('click', () => {
            state.drawerOpen = false;
            render();
          });
        }

        const drawerBrand = document.getElementById('drawer-home-brand');
        if (drawerBrand) drawerBrand.addEventListener('click', () => navigateTo('home'));

        const headerHomeBtn = document.getElementById('header-home-btn');
        if (headerHomeBtn) headerHomeBtn.addEventListener('click', () => navigateTo('home'));

        const homeNewChatBtn = document.getElementById('home-new-chat-btn');
        if (homeNewChatBtn) homeNewChatBtn.addEventListener('click', () => startNewChat(true));

        const drawerNewChatBtn = document.getElementById('drawer-new-chat');
        if (drawerNewChatBtn) drawerNewChatBtn.addEventListener('click', () => startNewChat(true));

        const headerNewChatBtn = document.getElementById('header-new-chat-btn');
        if (headerNewChatBtn) headerNewChatBtn.addEventListener('click', () => startNewChat(true));

        document.querySelectorAll('[data-go-view]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const targetView = btn.getAttribute('data-go-view');
            if (targetView) navigateTo(targetView);
          });
        });

        const spaceFilter = document.getElementById('drawer-space-filter');
        if (spaceFilter) {
          spaceFilter.addEventListener('change', (e) => {
            state.spaceFilterId = e.target.value;
            render();
          });
        }

        document.querySelectorAll('[data-open-conv]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-open-conv');
            if (id) openConversation(id);
          });
        });

        document.querySelectorAll('[data-del-conv]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-del-conv');
            if (id) deleteConversation(id);
          });
        });

        const toggleThemeAction = () => {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          saveTheme(state.theme);
          render();
        };

        const drawerThemeToggle = document.getElementById('drawer-theme-toggle');
        if (drawerThemeToggle) drawerThemeToggle.addEventListener('click', toggleThemeAction);

        const headerThemeBtn = document.getElementById('header-theme-btn');
        if (headerThemeBtn) headerThemeBtn.addEventListener('click', toggleThemeAction);

        const settingsThemeBtn = document.getElementById('settings-theme-btn');
        if (settingsThemeBtn) settingsThemeBtn.addEventListener('click', toggleThemeAction);

        const chatComposer = document.getElementById('chat-composer');
        if (chatComposer) {
          chatComposer.addEventListener('submit', (e) => {
            e.preventDefault();
            void sendMessage();
          });
        }

        const chatInput = document.getElementById('chat-input');
        if (chatInput) {
          chatInput.addEventListener('input', (e) => {
            state.draft = e.target.value;
            autoResizeComposer();
          });
          chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
              e.preventDefault();
              void sendMessage();
            }
          });
        }

        const stopBtn = document.getElementById('stop-btn');
        if (stopBtn) stopBtn.addEventListener('click', stopActiveRequest);

        document.querySelectorAll('[data-copy-msg]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const msgId = btn.getAttribute('data-copy-msg');
            const conv = getCurrentConversation();
            const msg = conv && conv.messages.find((m) => m.id === msgId);
            if (msg) void copyToClipboard(msg.content, msgId);
          });
        });

        document.querySelectorAll('[data-copy-code]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const preId = btn.getAttribute('data-copy-code');
            const pre = preId ? document.getElementById(preId) : null;
            if (pre) void copyToClipboard(pre.textContent || '', preId);
          });
        });

        document.querySelectorAll('[data-select-space]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-select-space');
            if (id && SPACES.some((s) => s.id === id)) {
              state.activeSpaceId = id;
              saveActiveSpace(id);
              startNewChat(true);
            }
          });
        });

        document.querySelectorAll('[data-pick-mood]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const mood = btn.getAttribute('data-pick-mood');
            if (mood) {
              state.dailyMood = mood;
              render();
            }
          });
        });

        const dailyForm = document.getElementById('daily-form');
        if (dailyForm) {
          dailyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const noteEl = document.getElementById('daily-note');
            const note = noteEl ? noteEl.value.trim() : state.dailyNote.trim();
            state.dailies.unshift({
              id: makeId('daily'),
              mood: state.dailyMood,
              note,
              createdAt: new Date().toISOString(),
            });
            state.dailyNote = '';
            saveDailies();
            render();
          });
        }

        document.querySelectorAll('[data-del-daily]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-del-daily');
            if (!id) return;
            state.dailies = state.dailies.filter((d) => d.id !== id);
            saveDailies();
            render();
          });
        });

        document.querySelectorAll('[data-pick-mem-tag]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const tag = btn.getAttribute('data-pick-mem-tag');
            if (tag) {
              state.memoryTag = tag;
              render();
            }
          });
        });

        const memoryForm = document.getElementById('memory-form');
        if (memoryForm) {
          memoryForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const inputEl = document.getElementById('memory-input');
            const text = (inputEl ? inputEl.value : state.memoryDraft).trim();
            if (!text) return;
            state.memories.unshift({
              id: makeId('mem'),
              tag: state.memoryTag,
              text,
              createdAt: new Date().toISOString(),
            });
            state.memoryDraft = '';
            saveMemories();
            render();
          });
        }

        document.querySelectorAll('[data-edit-mem]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-edit-mem');
            const target = state.memories.find((m) => m.id === id);
            if (target) {
              state.editingMemoryId = target.id;
              state.editingMemoryText = target.text;
              render();
            }
          });
        });

        const cancelMemEdit = document.getElementById('cancel-mem-edit');
        if (cancelMemEdit) {
          cancelMemEdit.addEventListener('click', () => {
            state.editingMemoryId = null;
            state.editingMemoryText = '';
            render();
          });
        }

        document.querySelectorAll('[data-save-mem]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-save-mem');
            const editInput = document.getElementById('memory-edit-input');
            const updatedText = (editInput ? editInput.value : state.editingMemoryText).trim();
            if (!id || !updatedText) return;
            const target = state.memories.find((m) => m.id === id);
            if (target) {
              target.text = updatedText;
              saveMemories();
            }
            state.editingMemoryId = null;
            state.editingMemoryText = '';
            render();
          });
        });

        document.querySelectorAll('[data-del-mem]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-del-mem');
            if (!id) return;
            state.memories = state.memories.filter((m) => m.id !== id);
            saveMemories();
            render();
          });
        });

        const createSnapshotBtn = document.getElementById('create-snapshot-btn');
        if (createSnapshotBtn) {
          createSnapshotBtn.addEventListener('click', () => createSnapshot());
        }

        document.querySelectorAll('[data-restore-snap]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-restore-snap');
            if (id) restoreSnapshot(id);
          });
        });

        const exportJsonBtn = document.getElementById('export-json-btn');
        if (exportJsonBtn) {
          exportJsonBtn.addEventListener('click', exportAllJson);
        }

        const importJsonArea = document.getElementById('import-json-area');
        if (importJsonArea) {
          importJsonArea.addEventListener('input', (e) => {
            state.importJsonDraft = e.target.value;
          });
        }

        const importJsonBtn = document.getElementById('import-json-btn');
        if (importJsonBtn) {
          importJsonBtn.addEventListener('click', () => {
            importFromJsonText(state.importJsonDraft);
          });
        }

        const closeErrorBtn = document.getElementById('close-error-btn');
        if (closeErrorBtn) {
          closeErrorBtn.addEventListener('click', () => {
            state.errorMessage = null;
            render();
          });
        }

        const closeNoticeBtn = document.getElementById('close-notice-btn');
        if (closeNoticeBtn) {
          closeNoticeBtn.addEventListener('click', () => {
            state.noticeMessage = null;
            render();
          });
        }
      }

      applyThemeClass(state.theme);
      render();
      if (state.view === 'chat') {
        scrollMessagesToBottom(true);
      }
    })();
  </script>
</body>
</html>
