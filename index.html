      /**
       * 最下部付近にいるか（または送信直後など強制追従すべきか）を判定してスクロールする。
       * ユーザーが手動で上へスクロールして過去ログを読んでいる間は邪魔しない。
       */
      function scrollMessagesToBottom(force = false) {
        const area = document.getElementById('chat-scroll-area');
        if (!area) return;

        const distanceFromBottom = area.scrollHeight - area.scrollTop - area.clientHeight;
        const nearBottom = distanceFromBottom <= 140;

        if (!force && (isUserScrolledUp || (!shouldAutoScroll && !nearBottom))) {
          return;
        }

        const applyScroll = () => {
          const el = document.getElementById('chat-scroll-area');
          if (!el) return;
          isProgrammaticScroll = true;
          el.scrollTop = el.scrollHeight;
          lastObservedScrollTop = el.scrollTop;
          if (force) {
            isUserScrolledUp = false;
            shouldAutoScroll = true;
          }
          if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(() => {
              isProgrammaticScroll = false;
            });
          } else {
            isProgrammaticScroll = false;
          }
        };

        applyScroll();
        if (force && typeof requestAnimationFrame === 'function') {
          requestAnimationFrame(applyScroll);
        }
      }

      /**
       * #chat-scroll-area の手動スクロールを検知し、上スクロール時は追従を一時停止、
       * 最下部付近へ戻った場合は自動追従を再開する。
       */
      function bindChatScrollListeners() {
        const area = document.getElementById('chat-scroll-area');
        if (!area) return;

        lastObservedScrollTop = area.scrollTop;

        const handleUserScrollIntent = () => {
          if (isProgrammaticScroll) return;
          const distanceFromBottom = area.scrollHeight - area.scrollTop - area.clientHeight;
          if (distanceFromBottom <= 48) {
            isUserScrolledUp = false;
            shouldAutoScroll = true;
          } else if (area.scrollTop < lastObservedScrollTop - 2) {
            isUserScrolledUp = true;
            shouldAutoScroll = false;
          }
          lastObservedScrollTop = area.scrollTop;
        };

        area.addEventListener('scroll', handleUserScrollIntent, { passive: true });
        area.addEventListener('touchstart', handleUserScrollIntent, { passive: true });
        area.addEventListener('touchmove', handleUserScrollIntent, { passive: true });
        area.addEventListener('wheel', handleUserScrollIntent, { passive: true });
      }

      /**
       * requestAnimationFrame を用いた滑らかな応答表示（最下部付近追従付き）
       */
      function cancelRevealAnimation() {
        if (revealRafId !== null && typeof cancelAnimationFrame === 'function') {
          cancelAnimationFrame(revealRafId);
        }
        revealRafId = null;
        activeRevealTask = null;
      }

      function revealReplySmoothly(assistantMsg, fullReply, onComplete) {
        cancelRevealAnimation();

        const totalLength = fullReply.length;
        if (totalLength === 0 || typeof requestAnimationFrame !== 'function') {
          assistantMsg.content = fullReply;
          assistantMsg.status = 'completed';
          onComplete();
          return;
        }

        const targetFrames = Math.min(75, Math.max(18, Math.ceil(totalLength / 6)));
        const charsPerFrame = Math.max(1, Math.ceil(totalLength / targetFrames));
        let cursor = 0;

        activeRevealTask = { assistantMsg, fullReply, onComplete };

        const step = () => {
          cursor = Math.min(totalLength, cursor + charsPerFrame);
          assistantMsg.content = fullReply.slice(0, cursor);

          const bodyEl = document.querySelector(`[data-stream-body="${assistantMsg.id}"]`);
          if (bodyEl) {
            bodyEl.innerHTML = renderMarkdown(assistantMsg.content);
            const area = document.getElementById('chat-scroll-area');
            const nearBottom = area
              ? area.scrollHeight - area.scrollTop - area.clientHeight <= 140
              : true;
            if (!isUserScrolledUp && (shouldAutoScroll || nearBottom)) {
              scrollMessagesToBottom(false);
            }
          }

          if (cursor < totalLength) {
            revealRafId = requestAnimationFrame(step);
          } else {
            revealRafId = null;
            activeRevealTask = null;
            assistantMsg.content = fullReply;
            assistantMsg.status = 'completed';
            onComplete();
          }
        };

        revealRafId = requestAnimationFrame(step);
      }

            conv.updatedAt = new Date().toISOString();

            state.isBusy = false;
            state.avatarMood = 'calm';
            activeAbortController = null;
            render();
            scrollMessagesToBottom(false);
          });
        } catch (err) {
          cancelRevealAnimation();
          const aborted = Boolean(err && err.name === 'AbortError');
          const detail = aborted
            ? '応答を停止しました。'
            : err instanceof Error
            ? err.message
            : '不明な通信エラーが発生しました。';

          if (aborted && assistantMsg.content.trim()) {
            assistantMsg.status = 'completed';
            state.avatarMood = 'calm';
          } else {
            assistantMsg.status = 'error';
            assistantMsg.errorText = detail;
            if (!aborted) {
              state.errorMessage = detail;
              state.avatarMood = 'error';
            } else {
              state.avatarMood = 'idle';
            }
          }

          conv.updatedAt = new Date().toISOString();

          state.isBusy = false;
          activeAbortController = null;
          render();

        if (state.isBusy) stopActiveRequest();
        const target = state.conversations.find((c) => c.id === id);
        if (!target) return;
        state.errorMessage = null;
        state.currentConversationId = target.id;
        if (target.spaceId && SPACES.some((s) => s.id === target.spaceId)) {
          state.activeSpaceId = target.spaceId;
          saveActiveSpace(target.spaceId);
        }
        state.view = 'chat';
        state.drawerOpen = false;
        state.avatarMood = 'calm';
        shouldAutoScroll = true;
        isUserScrolledUp = false;
        persistNavigation();
        render();
        scrollMessagesToBottom(true);
      }
